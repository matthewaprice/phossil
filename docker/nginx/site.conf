server {
    listen 80;
    server_name localhost;
    root /srv/phossil;

    # Redirect to a relative Location, so it still works behind the 8000:80 port mapping.
    absolute_redirect off;

    # Deny hidden files such as .DS_Store.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Pages end in a slash, as they do on a static host serving <route>/index.html.
    rewrite ^([^.]*[^/])$ $1/ permanent;

    # Our images and Vite's built CSS and JS are served under /assets/, the same URLs
    # as in the static build. While the vite container runs, pages load CSS and JS
    # from it instead.
    location /assets/img/ {
        alias /srv/phossil/img/;
    }

    location /assets/ {
        alias /srv/phossil/dist/assets/;
    }

    # Everything else is a page, rendered by the front controller.
    # No other file under phossil/ is ever served, so the PHP source stays private.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/phossil/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }
}
