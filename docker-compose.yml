name: phossil

services:
  # Renders the pages. nginx hands it every request that is not an asset.
  php:
    image: php:8.5-fpm
    working_dir: /srv
    volumes:
      - .:/srv
  nginx:
    image: nginx:1.29
    ports:
      - "8000:80"
    volumes:
      - ./phossil:/srv/phossil:ro
      - ./docker/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  # The Vite dev server: serves the CSS and JS with hot reload while it runs.
  vite:
    build: ./docker/vite
    init: true
    ports:
      - "5173:5173"
    volumes:
      - ./phossil:/srv/phossil
      # phossil's components, for Tailwind's classes, and the dialog script.
      - ./src:/srv/src:ro
      - ./resources:/srv/resources:ro
      - ./vite.config.js:/srv/vite.config.js:ro
      - ./package.json:/srv/package.json:ro
      - ./pnpm-lock.yaml:/srv/pnpm-lock.yaml:ro
